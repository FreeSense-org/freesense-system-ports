name: System ports quality

on:
  pull_request:
  push:
    branches: [main, "RELENG_*"]

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Enforce repository boundary
        run: python3 tools/boundary_audit.py
      - name: Resolve matching FreeSense source branch
        id: source
        env:
          # A same-named branch first, then the branch a pull request targets
          # (RELENG_1_1 for Stable fixes, so they are checked against the
          # Stable line), then main.
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          ref=main
          for candidate in "${CANDIDATE_REF}" "${BASE_REF}"; do
            if [ -n "${candidate}" ] && git ls-remote --exit-code --heads https://github.com/FreeSense-org/freesense.git "${candidate}" >/dev/null; then
              ref=${candidate}
              break
            fi
          done
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: FreeSense-org/freesense
          path: freesense-src
          ref: ${{ steps.source.outputs.ref }}
      - name: FreeSense-system pkg-plist matches the source tree
        run: python3 tools/system_plist_audit.py --source freesense-src
      - name: Reject credentials
        run: |
          if git grep -IEn '(^[[:space:]]*-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----[[:space:]]*$|R2_SECRET_ACCESS_KEY[=:][[:space:]]*[^$<{])'; then
            echo 'Potential credential material found' >&2
            exit 1
          fi
      - name: Reject vendor infrastructure dependencies
        run: |
          if git grep -IEn '(https?://[^[:space:]]*netgate\.com|(?:files|packages(-beta)?|gitlab|codesigner)\.netgate\.com|\.nyi\.netgate\.com)' -- . ':!NOTICE' ':!*.md'; then
            echo 'Active Netgate infrastructure reference found' >&2
            exit 1
          fi
      - name: PHP and shell syntax
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq php-cli
          find . -type f \( -name '*.php' -o -name '*.inc' \) ! -path './freesense-src/*' -print0 | xargs -0 -r -n1 php -l
          find . -type f \( -name 'pkg-install.in' -o -name 'pkg-deinstall.in' \) ! -path './freesense-src/*' -print0 | xargs -0 -r -n1 sh -n
          sh -n sysutils/FreeSense-repoc/files/FreeSense-repoc
          sh -n sysutils/FreeSense-upgrade/files/FreeSense-upgrade
          sh -n sysutils/FreeSense-upgrade/files/FreeSense-upgrade.wrapper
          sh -n sysutils/FreeSense-upgrade/files/FreeSense-repo-setup
          sh -n sysutils/FreeSense-cloud-init/files/freesense-cloud-init.in
      - name: Repository updater safety
        run: >-
          python3 -m unittest -v
          tests/test_repoc.py tests/test_upgrade_guard.py tests/test_cloud_init.py
